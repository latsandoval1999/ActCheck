name: daily-watch
# ActCheck / TrAIce monitoring: every day at 06:17 Manila time (22:17 UTC), look for newly filed bills,
# screen them, read them (OCR if scanned), rebuild the corpus and commit the results.
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch: {}        # "Run workflow" button for a manual check

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
          pip install pandas scikit-learn anthropic
      - name: Check for new bills
        run: python -m pipeline.watch
      - name: Rebuild corpus
        run: python -m pipeline.build_corpus
      - name: TrAIce triage of new entity bills (only if an API key secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: env.ANTHROPIC_API_KEY != ''
        run: python -c "from pipeline.watch import triage; triage()"
      - name: Commit results
        run: |
          git config user.name "bill-watch-bot"
          git config user.email "bill-watch-bot@users.noreply.github.com"
          git add data/watch data/raw_text/_watch data/processed
          git diff --cached --quiet || git commit -m "Daily watch $(date -u +%Y-%m-%d)"
          git push
