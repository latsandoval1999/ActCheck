name: daily-watch
# ActCheck / TrAIce monitoring: every day at 06:17 Manila time (22:17 UTC), refresh the bill list, look for
# newly filed House and Senate bills, read them (OCR if scanned), rebuild the corpus and commit the results.
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch: {}        # "Run workflow" button for a manual check

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
          pip install pandas scikit-learn anthropic
      - name: Refresh the bill list from Open Congress Data (BetterGov.PH, CC0)
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/bettergovph/open-congress-data /tmp/occ
          git -C /tmp/occ sparse-checkout set data/document/hb data/document/sb
          python -m pipeline.build_indexes --open-congress /tmp/occ
      - name: Check for new bills (House PDF server, Senate listing)
        run: python -m pipeline.watch
      - name: Rebuild corpus
        run: python -m pipeline.build_corpus
      - name: TrAIce triage of new entity bills (only if an API key secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: env.ANTHROPIC_API_KEY != ''
        run: python -c "from pipeline.watch import triage; triage()"
      - name: Commit results
        run: |
          git config user.name "bill-watch-bot"
          git config user.email "bill-watch-bot@users.noreply.github.com"
          git add data/watch data/raw_text/_watch data/processed
          git diff --cached --quiet || git commit -m "Daily watch $(date -u +%Y-%m-%d)"
          git push
